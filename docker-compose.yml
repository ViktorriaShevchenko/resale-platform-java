version: '3.8'

services:
  postgres:
    image: postgres:12
    container_name: resale-postgres
    environment:
      POSTGRES_DB: resale_platform_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d resale_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: resale-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resale_platform_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user

volumes:
  postgres_data: